
{% extends "base.html" %}

{% block title %}{{ item.name }} | Café Calle Ocho{% endblock %}

{% block content %}

<h1>{{ item.name }}</h1>

<p><strong>Category:</strong> {{ item.category }}</p>

<p>{{ item.description }}</p>

<h3>${{ "%.2f"|format(item.price_cents / 100) }}</h3>

<a href="{{ url_for('new_order') }}" role="button">
    Add to Order
</a>

<p>
    <a href="{{ url_for('menu') }}">Back to Menu</a>
</p>

{% endblock %}
