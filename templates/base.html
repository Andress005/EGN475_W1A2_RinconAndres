
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Café Calle Ocho{% endblock %}</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.min.css">
</head>
<body>

<header class="container">
    <nav>
        <ul>
            <li><a href="{{ url_for('index') }}"><strong>Café Calle Ocho</strong></a></li>
        </ul>
        <ul>
            <li><a href="{{ url_for('menu') }}">Menu</a></li>
            <li><a href="{{ url_for('new_order') }}">Your Order</a></li>
            <li><a href="{{ url_for('kitchen') }}">Kitchen</a></li>
            <li><a href="{{ url_for('orders') }}">Order History</a></li>
        </ul>
    </nav>
</header>

<main class="container">
    {% block content %}{% endblock %}
</main>

<footer class="container">
    <hr>
    <p>Café Calle Ocho | Miami, Florida</p>
</footer>

</body>
</html>
